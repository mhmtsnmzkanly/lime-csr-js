<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lime nested mounts</title>
  <style>
    body { max-width: 46rem; margin: 3rem auto; padding: 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    section { padding: 1rem; border: 1px solid #94a3b8; border-radius: .6rem; }
    #inner { margin-top: 1rem; border-color: #0f766e; }
    button { padding: .5rem .8rem; margin: .25rem; }
  </style>
</head>
<body>
  <main id="outer"></main>
  <template id="tpl-outer">
    <section>
      <h1>Outer mount</h1>
      <button type="button" data-on-click="outer">Outer handler</button>
      <p data-text="outerMessage"></p>
      <div id="inner"></div>
    </section>
  </template>
  <template id="tpl-inner">
    <section id="inner">
      <h2>Inner mount</h2>
      <button type="button" data-on-click="inner">Inner handler</button>
      <p data-text="innerMessage"></p>
    </section>
  </template>
  <script type="module">
    import { createStore, mount } from '/src/index.js';

    const outer = mount({
      target: document.querySelector('#outer'),
      template: 'outer',
      store: createStore({ outerMessage: 'Outer is ready.' }),
      handlers: { outer: ({ store }) => store.set('outerMessage', 'Outer handled its own event.') },
    });
    const inner = mount({
      target: outer.target.querySelector('#inner'),
      template: 'inner',
      store: createStore({ innerMessage: 'Inner is independent.' }),
      handlers: { inner: ({ store }) => store.set('innerMessage', 'Inner handled its own event.') },
    });
    window.addEventListener('unload', () => inner.unmount(), { once: true });
  </script>
</body>
</html>
