<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>lime-csr plugins — verification</title>
  <style>
    body   { font-family: monospace; padding: 1.5rem; background: #0f1117; color: #e2e8f0; }
    h1     { font-size: 1rem; color: #94a3b8; margin-bottom: 1.5rem; }
    h2     { font-size: .85rem; color: #60a5fa; margin: 1.25rem 0 .25rem; }
    .pass  { color: #4ade80; }
    .fail  { color: #f87171; }
    .group { color: #60a5fa; }
    .note  { color: #fbbf24; }
    .box   { border: 1px solid #334155; padding: .4rem .75rem; border-radius: 4px;
             margin-top: .25rem; font-size: .8rem; color: #94a3b8; }
  </style>
</head>
<body>
<h1>src/plugins.js — Plugin API verification tests</h1>
<pre id="log"></pre>
<div id="renders"></div>

<!-- Templates for verification -->
<template id="tpl-plugin-basic">
  <div class="card" data-lime-tooltip="tipText" data-lime-highlight>
    <span class="label">Hello Plugin</span>
  </div>
</template>

<template id="tpl-plugin-reactive">
  <div>
    <button id="btn" data-lime-count="clicks">Click Me</button>
  </div>
</template>

<script type="module">
  import {
    createStore,
    defineModule,
    createEngine,
    attr,
    unmount,
  } from '../src/index.js';

  const log  = document.getElementById('log');
  const area = document.getElementById('renders');
  let passed = 0, failed = 0;

  function assert(label, actual, expected) {
    const ok  = JSON.stringify(actual) === JSON.stringify(expected);
    const det = ok ? '' :
      `\n  expected: ${JSON.stringify(expected)}  actual: ${JSON.stringify(actual)}`;
    log.innerHTML += `<span class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${label}${det}</span>\n`;
    ok ? passed++ : failed++;
  }

  function group(label) {
    log.innerHTML += `\n<span class="group">── ${label}</span>\n`;
  }

  function note(msg) {
    log.innerHTML += `<span class="note">   ↳ ${msg}</span>\n`;
  }

  function show(title, el) {
    const h = document.createElement('h2');
    h.textContent = title;
    area.appendChild(h);
    const box = document.createElement('div');
    box.className = 'box';
    box.appendChild(el);
    area.appendChild(box);
  }

  // ── 1. defineModule structure & freeze ──────────────────────────────────────
  group('1. defineModule creates frozen module definition');
  {
    const tooltipMod = defineModule({
      name: 'example-tooltip',
      triggers: [
        attr('data-lime-tooltip', {
          phase: 'link',
          setup(element, data, ctx) {
            const path = element.getAttribute('data-lime-tooltip');
            element.title = ctx.store ? ctx.store.get(path) ?? '' : '';
          },
        }),
      ],
    });

    assert('module is frozen', Object.isFrozen(tooltipMod), true);
    assert('module name matches', tooltipMod.name, 'example-tooltip');
    assert('module triggers frozen', Object.isFrozen(tooltipMod.triggers), true);
    note('defineModule ensures immutable module shape across engines ✓');
  }

  // ── 2. Custom Module setup & execution ──────────────────────────────────────
  group('2. Module initializes and applies attributes via createEngine');
  {
    let cleanupsRun = 0;
    const uiMod = defineModule({
      name: 'ui-enhancements',
      triggers: [
        attr('data-lime-tooltip', {
          phase: 'link',
          setup(element, data, ctx) {
            const path = element.getAttribute('data-lime-tooltip');
            element.setAttribute('title', ctx.store?.get(path) || '');
            return () => { cleanupsRun++; };
          },
        }),
        attr('data-lime-highlight', {
          phase: 'link',
          setup(element) {
            element.classList.add('is-highlighted');
            return () => { cleanupsRun++; };
          },
        }),
      ],
    });

    const engine = createEngine({ modules: [uiMod] });
    const store = createStore({ tipText: 'Helpful hint' });
    const target = document.createElement('div');
    const cleanup = engine.mount({ target: target, template: 'plugin-basic', store: store });

    const card = target.querySelector('.card');
    assert('data-lime-tooltip set title attribute', card.getAttribute('title'), 'Helpful hint');
    assert('data-lime-highlight added CSS class', card.classList.contains('is-highlighted'), true);

    cleanup();
    assert('all trigger cleanups executed on mount cleanup', cleanupsRun, 2);
    show('2. Custom module applied to card', target);
  }

  // ── 3. Reactive watch inside module ─────────────────────────────────────────
  group('3. Module uses ctx.watch for store reactivity');
  {
    const counterMod = defineModule({
      name: 'counter-badge',
      triggers: [
        attr('data-lime-count', {
          phase: 'link',
          setup(element, data, ctx) {
            const path = element.getAttribute('data-lime-count');
            return ctx.watch(path, (count) => {
              element.dataset.current = String(count);
            }, { immediate: true });
          },
        }),
      ],
    });

    const engine = createEngine({ modules: [counterMod] });
    const store = createStore({ clicks: 0 });
    const target = document.createElement('div');
    engine.mount({ target: target, template: 'plugin-reactive', store: store });

    const btn = target.querySelector('#btn');
    assert('initial count synced via watch', btn.dataset.current, '0');

    store.set('clicks', 5);
    assert('updated count synced via watch', btn.dataset.current, '5');

    unmount(target);
    store.set('clicks', 10);
    assert('unmount stopped reactive watch updates', btn.dataset.current, '5');
  }

  // ── Summary ─────────────────────────────────────────────────────────────────
  log.innerHTML += `\n<span class="${failed === 0 ? 'pass' : 'fail'}">`
    + `${passed + failed} tests: ${passed} passed, ${failed} failed.</span>\n`;
</script>
</body>
</html>
